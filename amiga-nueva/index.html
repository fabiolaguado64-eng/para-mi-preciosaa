
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti Amiga 💚</title>

<style>
body{
  background:#042f2e;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

/* Texto inicio */
.inicio{
  color:#5eead4;
  font-size:26px;
  font-family:cursive;
  margin-bottom:10px;
}

/* Manito */
.mano{
  font-size:40px;
  margin-bottom:15px;
}

/* Botón */
button{
  padding:15px 35px;
  font-size:18px;
  background:#14b8a6;
  color:white;
  border:none;
  border-radius:12px;
}

/* Contenido oculto */
#contenido{
  display:none;
}

/* Imagen */
img{
  width:85%;
  max-width:300px;
  margin-top:20px;
  animation: aparecer 3s ease-out forwards;
}

@keyframes aparecer{
  from{
    transform: scale(0);
    opacity:0;
  }
  to{
    transform: scale(1);
    opacity:1;
  }
}

/* Mensaje */
p{
  color:#99f6e4;
  font-family:cursive;
  font-size:20px;
  margin-top:20px;
  line-height:1.6;
  animation: texto 4s ease-in forwards;
}

@keyframes texto{
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>

<body>

<div id="inicio">
  <div class="inicio">Amiga presiona aquí 💚</div>
  <div class="mano">👇</div>
  <button onclick="mostrar()">Abrir 🌼</button>
</div>

<div id="contenido">
  <img src="ramo.png">
  <p>
Tu amistad es un regalo que valoro muchísimo.  
Gracias por estar en los buenos momentos y también en los difíciles.  
Me encanta poder contar contigo y saber que siempre puedo escribirte.  
Que nuestra amistad siga creciendo con el tiempo. 💚✨
  </p>
</div>

<script>
function mostrar(){
  document.getElementById("inicio").style.display="none";
  document.getElementById("contenido").style.display="block";
}
</script>

</body>
</html>
